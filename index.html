<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alat Bantu</title>
<style>
  :root{--aksen:#0f766e;--aksen-gelap:#0b5a54;--latar:#f8fafc;--teks:#1e293b;--garis:#e2e8f0}
  *{box-sizing:border-box}
  body{font-family:Cambria,Georgia,serif;margin:0;background:var(--latar);color:var(--teks);line-height:1.5}
  .wadah{display:flex;min-height:100vh}
  .sidebar{width:230px;background:#fff;border-right:1px solid var(--garis);padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;transition:transform .2s}
  .sidebar h1{margin:0 0 20px 8px;font-size:20px;color:var(--aksen-gelap)}
  .menu-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--teks);margin-bottom:4px;transition:background .15s;font-family:inherit}
  .menu-btn:hover{background:var(--latar)}
  .menu-btn.aktif{background:var(--aksen);color:#fff}
  .menu-btn .ikon{width:22px;text-align:center;font-size:16px}
  .tombol-menu{display:none;position:fixed;top:12px;left:12px;z-index:20;background:var(--aksen);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:18px;cursor:pointer}
  .konten{flex:1;min-width:0;padding:0}
  .tab{display:none;height:100vh}
  .tab.aktif{display:block}
  .tab iframe{width:100%;height:100%;border:0;background:var(--latar)}
  @media (max-width:760px){
    .tombol-menu{display:block}
    .sidebar{position:fixed;left:0;top:0;z-index:15;transform:translateX(-100%);box-shadow:4px 0 16px rgba(0,0,0,.08)}
    .sidebar.terbuka{transform:translateX(0)}
    .konten{padding-top:0}
  }
</style>
</head>
<body>

<div class="wadah">

  <button class="tombol-menu" id="btnMenu" aria-label="Buka menu">☰</button>

  <aside class="sidebar" id="sidebar">
    <h1>Alat Bantu</h1>
    <button class="menu-btn aktif" data-tab="bku"><span class="ikon">📒</span>BKU Bendahara</button>
    <button class="menu-btn" data-tab="terbilang"><span class="ikon">🔢</span>Terbilang</button>
    <button class="menu-btn" data-tab="ocr"><span class="ikon">🖼️</span>Gambar ke Teks</button>
    <!-- Fitur baru: tambahkan tombol di sini, lalu buat file HTML terpisah dan tambahkan section di bawah -->
  </aside>

  <main class="konten">

    <section id="bku" class="tab aktif">
      <iframe src="bku.html" title="BKU Bendahara"></iframe>
    </section>

    <section id="terbilang" class="tab">
      <iframe src="terbilang.html" title="Terbilang"></iframe>
    </section>

    <section id="ocr" class="tab">
      <iframe src="ocr.html" title="Gambar ke Teks"></iframe>
    </section>

    <!-- Fitur baru: tambahkan <section id="..." class="tab"><iframe src="..."></iframe></section> di sini -->

  </main>
</div>

<script>
const sidebar = document.getElementById("sidebar");
document.getElementById("btnMenu").addEventListener("click", () => {
  sidebar.classList.toggle("terbuka");
});

document.querySelectorAll(".menu-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".menu-btn").forEach(b => b.classList.remove("aktif"));
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("aktif"));
    btn.classList.add("aktif");
    document.getElementById(btn.dataset.tab).classList.add("aktif");
    sidebar.classList.remove("terbuka");
  });
});
</script>
</body>
</html>
